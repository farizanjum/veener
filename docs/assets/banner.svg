    <g transform="translate(268, 10)">
      <path d="M 0 34 L 0 7 Q 0 0 7 0 L 210 0 Q 217 0 217 7 L 217 34 Z" fill="#141514" stroke="#2A2D2A" stroke-width="1" />
      <line x1="1" y1="34" x2="216" y2="34" stroke="#141514" stroke-width="2" />
      <circle cx="14" cy="17" r="3.5" fill="#20E6A1" />
      <text x="25" y="21" fill="#ECEAE4" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">Q4 Acquisition Targets.md</text>
    </g>

    <!-- Note Header: Title + Subtle Green Unlocked in RAM Pill -->
    <g transform="translate(28, 78)">
      <text x="0" y="18" fill="#ECEAE4" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" letter-spacing="-0.03em">Q4 Acquisition Targets</text>

      <rect x="336" y="0" width="120" height="24" rx="12" fill="#107A4D" fill-opacity="0.2" stroke="#107A4D" stroke-opacity="0.6" stroke-width="1" />
      <circle cx="349" cy="12" r="3" fill="#20E6A1" />
      <text x="358" y="16" fill="#6CE9A6" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600">Unlocked in RAM</text>
    </g>

    <!-- 4 Clean Lines of Decrypted Note Text -->
    <g transform="translate(28, 134)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#D2D0C8">
      <text x="0" y="0" fill="#ECEAE4" font-weight="600">Target A: Horizon Labs ($14.2M cash + retention pool)</text>
      <text x="0" y="28">- term sheet signed by both co-founders on Friday</text>
      <text x="0" y="56">- key risk: soc2 renewal pending before nov 18 close</text>
      <text x="0" y="84">- keep legal counsel on separate signal thread</text>
    </g>

    <!-- Sleek Inline system-topology.png (RAM blob:) Card -->
    <g transform="translate(28, 250)">
      <rect width="456" height="156" rx="8" fill="#181B18" stroke="#107A4D" stroke-opacity="0.45" stroke-width="1" />

      <!-- Card Top Meta Row -->
      <text x="16" y="24" fill="#6CE9A6" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">system-topology.png (RAM blob:)</text>
      <text x="440" y="24" text-anchor="end" fill="#8E8D86" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">blob:obsidian.md/7c9e-ram</text>
      <line x1="0" y1="36" x2="456" y2="36" stroke="#262A26" stroke-width="1" />

      <!-- Minimal 3-Node Topology Schematic Inside Image Card -->
      <g transform="translate(16, 52)">
        <rect x="0" y="0" width="128" height="72" rx="6" fill="#141614" stroke="#107A4D" stroke-width="1" />
        <text x="12" y="30" fill="#ECEAE4" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5" font-weight="600">RAM Blob URL</text>
        <text x="12" y="48" fill="#20E6A1" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">Zero disk file</text>

        <line x1="128" y1="36" x2="148" y2="36" stroke="#5E5D58" stroke-width="1.5" />

        <rect x="148" y="0" width="128" height="72" rx="6" fill="#141614" stroke="#2A2D2A" stroke-width="1" />
        <text x="160" y="30" fill="#ECEAE4" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5" font-weight="600">AES-256-GCM</text>
        <text x="160" y="48" fill="#8E8D86" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">4 KB padded</text>

        <line x1="276" y1="36" x2="296" y2="36" stroke="#5E5D58" stroke-width="1.5" />

        <rect x="296" y="0" width="128" height="72" rx="6" fill="#141614" stroke="#2A2D2A" stroke-width="1" />
        <text x="308" y="30" fill="#ECEAE4" font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5" font-weight="600">draft_cache</text>
        <text x="308" y="48" fill="#8E8D86" font-family="'Geist Mono', ui-monospace, monospace" font-size="10">YAML envelope</text>
      </g>
    </g>

    <!-- Bottom Status Bar (height: 36px, y=452..488) -->
    <path d="M 1 452 L 511 452 L 511 478 Q 511 487 502 487 L 10 487 Q 1 487 1 478 Z" fill="#101210" />
    <line x1="0" y1="452" x2="512" y2="452" stroke="#2A2D2A" stroke-width="1" />

    <circle cx="20" cy="470" r="3.5" fill="#20E6A1" />
    <text x="30" y="474" fill="#ECEAE4" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500">Veneer: Real (RAM only)</text>

    <text x="348" y="474" fill="#20E6A1" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.12em">&#x2022;&#x2022;&#x2022;&#x2022;</text>
    <text x="492" y="474" text-anchor="end" fill="#8E8D86" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">34 words | 6 lines</text>
  </g>
