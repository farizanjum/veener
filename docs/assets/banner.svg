<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <!-- Subtle 20px Swiss Dotted Grid -->
    <pattern id="swiss-dots-banner" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D5D3CA" />
    </pattern>

    <!-- Subtle Shadow for Sleek Obsidian Window -->
    <filter id="obs-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#141413" flood-opacity="0.16" />
    </filter>

    <!-- Mint #20E6A1 + Registration Cross -->
    <g id="reg-cross-banner">
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#20E6A1" stroke-width="1.5" />
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#20E6A1" stroke-width="1.5" />
    </g>
  </defs>

  <!-- Warm Stone Canvas (#EFEFEA) + 20px Dot Grid -->
  <rect width="1280" height="640" fill="#EFEFEA" />
  <rect width="1280" height="640" fill="url(#swiss-dots-banner)" />

  <!-- Outer Swiss Frame (x=32, y=32, width=1216, height=576 -> x=32..1248, y=32..608) -->
  <rect x="32" y="32" width="1216" height="576" fill="#F1EFEB" fill-opacity="0.72" stroke="#CFCBC2" stroke-width="1" />

  <!-- Right Column Subtle Warm Surface -->
  <rect x="660" y="32.5" width="587.5" height="575" fill="#EAE7DF" fill-opacity="0.45" />

  <!-- Bottom 3 Swiss Cells Background in Left Column (y=536..608) -->
  <rect x="32.5" y="536" width="627.5" height="71.5" fill="#F8F7F3" />

  <!-- Structural 1px solid #CFCBC2 Swiss Grid Lines -->
  <!-- Center Vertical Divider (x=660) -->
  <line x1="660" y1="32" x2="660" y2="608" stroke="#CFCBC2" stroke-width="1" />
  <!-- Left Column Bottom Cells Top Divider (y=536) -->
  <line x1="32" y1="536" x2="660" y2="536" stroke="#CFCBC2" stroke-width="1" />
  <!-- Left Column Bottom 3 Cells Vertical Dividers (x=241, x=451) -->
  <line x1="241" y1="536" x2="241" y2="608" stroke="#CFCBC2" stroke-width="1" />
  <line x1="451" y1="536" x2="451" y2="608" stroke="#CFCBC2" stroke-width="1" />

  <!-- Mint #20E6A1 + Registration Crosses at All Intersections -->
  <use href="#reg-cross-banner" x="32" y="32" />
  <use href="#reg-cross-banner" x="660" y="32" />
  <use href="#reg-cross-banner" x="1248" y="32" />
  <use href="#reg-cross-banner" x="32" y="536" />
  <use href="#reg-cross-banner" x="241" y="536" />
  <use href="#reg-cross-banner" x="451" y="536" />
  <use href="#reg-cross-banner" x="660" y="536" />
  <use href="#reg-cross-banner" x="32" y="608" />
  <use href="#reg-cross-banner" x="241" y="608" />
  <use href="#reg-cross-banner" x="451" y="608" />
  <use href="#reg-cross-banner" x="660" y="608" />
  <use href="#reg-cross-banner" x="1248" y="608" />

  <!-- ================= LEFT COLUMN (x=32..660, Generous Whitespace) ================= -->
  <!-- Brand Lockup: Chameleon Icon Mark (48x48) + VENEER (28px bold #141413) -->
  <g transform="translate(80, 92)">
    <svg width="48" height="48" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="14" fill="#107A4D" />
      <path d="M64 64H16C7 64 2 57 2 48C2 39 9 33 17 33C24 33 29 38 29 45C29 50 25 53 20 53C16 53 13 50 13 46C13 43 16 41 19 41L25 55C23 50 22 45 22 39C22 28 29 20 38 18C40 11 45 7 52 7C58 7 63 12 64 19V64Z" fill="#F1EFEB" />
      <circle cx="18" cy="46" r="7" fill="#107A4D" />
      <circle cx="19" cy="46" r="3.5" fill="#F1EFEB" />
      <path d="M39 64C39 51 46 45 57 45H64V64H39Z" fill="#141413" />
      <circle cx="34" cy="34" r="5.8" fill="#141413" />
      <circle cx="32" cy="32" r="2" fill="#F1EFEB" />
      <circle cx="51" cy="34" r="5.8" fill="#141413" />
      <circle cx="49" cy="32" r="2" fill="#F1EFEB" />
    </svg>
    <text x="64" y="34" fill="#141413" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="-0.04em">VENEER</text>
  </g>

  <!-- Headline (58px bold, -0.04em tracking, #141413 & #107A4D) -->
  <g transform="translate(80, 244)">
    <text x="0" y="0" fill="#141413" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="-0.04em">Notes that look like</text>
    <text x="0" y="66" fill="#107A4D" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" letter-spacing="-0.04em">ordinary notes.</text>
  </g>

  <!-- Subtitle (18px monospace, #565860) -->
  <g transform="translate(80, 376)">
    <text x="0" y="0" fill="#565860" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="500">Real notes, titles, and images encrypted in RAM.</text>
    <text x="0" y="32" fill="#565860" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="500">Boring cover text on disk.</text>
  </g>

  <!-- Bottom of Left Column: 3 Clean Swiss Cells -->
  <g font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#141413">
    <!-- Cell 1 (x=32..241) -->
    <circle cx="52" cy="572" r="3.5" fill="#107A4D" />
    <text x="64" y="576">AES-256-GCM + Argon2id</text>

    <!-- Cell 2 (x=241..451) -->
    <circle cx="265" cy="572" r="3.5" fill="#107A4D" />
    <text x="277" y="576">;; Blind Unlock</text>

    <!-- Cell 3 (x=451..660) -->
    <circle cx="473" cy="572" r="3.5" fill="#107A4D" />
    <text x="485" y="576">135 tok/s Local GPU</text>
  </g>

