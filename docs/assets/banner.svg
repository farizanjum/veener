    <circle cx="34" cy="23" r="4.5" fill="#D29922" fill-opacity="0.8" />
    <circle cx="48" cy="23" r="4.5" fill="#2EA043" fill-opacity="0.8" />

    <!-- Tab 1 (Muted): Grocery run (Saturday).md -->
    <g transform="translate(68, 10)">
      <path d="M 0 34 L 0 7 Q 0 0 7 0 L 188 0 Q 195 0 195 7 L 195 34 Z" fill="#171917" />
      <circle cx="14" cy="17" r="3" fill="#5E5D58" />
      <text x="24" y="21" fill="#8E8D86" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Grocery run (Saturday).md</text>
