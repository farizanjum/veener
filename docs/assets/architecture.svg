<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" fill="none">
  <defs>
    <!-- Subtle 20px Swiss Dotted Grid -->
    <pattern id="swiss-dots-arch" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D5D3CA" />
    </pattern>

    <!-- Mint #20E6A1 + Registration Cross -->
    <g id="reg-cross-arch">
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#20E6A1" stroke-width="1.5" />
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#20E6A1" stroke-width="1.5" />
    </g>
  </defs>

  <!-- Warm Stone Canvas (#EFEFEA) + 20px Dot Grid -->
  <rect width="1200" height="420" fill="#EFEFEA" />
  <rect width="1200" height="420" fill="url(#swiss-dots-arch)" />

  <!-- Outer Swiss Frame (x=24, y=24, width=1152, height=372 -> x=24..1176, y=24..396) -->
  <rect x="24" y="24" width="1152" height="372" fill="#F1EFEB" fill-opacity="0.78" stroke="#CFCBC2" stroke-width="1" />

  <!-- Bottom Horizontal Band Surface (y=332..396, height=64) -->
  <rect x="24.5" y="332" width="575.5" height="63.5" fill="#F8F7F3" />
  <rect x="600" y="332" width="575.5" height="63.5" fill="#141514" />

  <!-- 1px solid #CFCBC2 Vertical Column Lines (4 equal columns of 288px: 24, 312, 600, 888, 1176) -->
  <line x1="312" y1="24" x2="312" y2="332" stroke="#CFCBC2" stroke-width="1" />
  <line x1="600" y1="24" x2="600" y2="396" stroke="#CFCBC2" stroke-width="1" />
  <line x1="888" y1="24" x2="888" y2="332" stroke="#CFCBC2" stroke-width="1" />

  <!-- Bottom Horizontal Band Top Border (y=332) -->
  <line x1="24" y1="332" x2="1176" y2="332" stroke="#CFCBC2" stroke-width="1" />

  <!-- Mint #20E6A1 + Registration Crosses at Frame Corners & Grid Intersections -->
  <use href="#reg-cross-arch" x="24" y="24" />
  <use href="#reg-cross-arch" x="312" y="24" />
  <use href="#reg-cross-arch" x="600" y="24" />
  <use href="#reg-cross-arch" x="888" y="24" />
  <use href="#reg-cross-arch" x="1176" y="24" />
  <use href="#reg-cross-arch" x="24" y="332" />
  <use href="#reg-cross-arch" x="312" y="332" />
  <use href="#reg-cross-arch" x="600" y="332" />
  <use href="#reg-cross-arch" x="888" y="332" />
  <use href="#reg-cross-arch" x="1176" y="332" />
  <use href="#reg-cross-arch" x="24" y="396" />
  <use href="#reg-cross-arch" x="600" y="396" />
  <use href="#reg-cross-arch" x="1176" y="396" />

  <!-- ================= COLUMN 1: STEP 01 (x=24..312) ================= -->
  <g transform="translate(52, 56)">
    <!-- Step Top Row -->
    <text x="0" y="22" fill="#107A4D" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.04em">STEP 01</text>
    <g transform="translate(198, 0)">
      <rect width="34" height="34" rx="6" fill="#107A4D" fill-opacity="0.1" stroke="#107A4D" stroke-opacity="0.25" stroke-width="1" />
      <g transform="translate(8, 8)" stroke="#107A4D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="3" y="3" width="12" height="12" rx="1.5" />
        <rect x="6" y="6" width="6" height="6" rx="0.8" />
        <line x1="9" y1="1" x2="9" y2="3" />
        <line x1="9" y1="15" x2="9" y2="17" />
        <line x1="1" y1="9" x2="3" y2="9" />
        <line x1="15" y1="9" x2="17" y2="9" />
      </g>
    </g>

    <!-- Title -->
    <text x="0" y="76" fill="#141413" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" letter-spacing="-0.03em">Local AI Cover</text>

    <!-- Description -->
    <g transform="translate(0, 110)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#565860">
      <text x="0" y="0"><tspan fill="#141413" font-weight="600">Qwen3</tspan> on Vulkan GPU</text>
      <text x="0" y="23">writes a persona-matched</text>
      <text x="0" y="46">cover note in &lt;1s.</text>
    </g>

    <!-- Bottom Spec Pill -->
    <rect x="0" y="196" width="232" height="44" rx="6" fill="#F8F7F3" stroke="#CFCBC2" stroke-width="1" />
    <text x="14" y="223" fill="#107A4D" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">135 tok/s RTX Vulkan</text>
  </g>

  <!-- ================= COLUMN 2: STEP 02 (x=312..600) ================= -->
  <g transform="translate(340, 56)">
    <!-- Step Top Row -->
    <text x="0" y="22" fill="#107A4D" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.04em">STEP 02</text>
    <g transform="translate(198, 0)">
      <rect width="34" height="34" rx="6" fill="#107A4D" fill-opacity="0.1" stroke="#107A4D" stroke-opacity="0.25" stroke-width="1" />
      <g transform="translate(8, 8)" stroke="#107A4D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="12" cy="6" r="4" />
        <path d="M9 9L2 16v2h3v-2h2v-2h2l1.5-1.5" />
      </g>
    </g>

    <!-- Title -->
    <text x="0" y="76" fill="#141413" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" letter-spacing="-0.03em">Blind <tspan fill="#107A4D" font-family="'Geist Mono', ui-monospace, monospace">;;</tspan> Trigger</text>

    <!-- Description -->
    <g transform="translate(0, 110)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#565860">
      <text x="0" y="0">CodeMirror <tspan fill="#141413" font-weight="600">transactionFilter</tspan></text>
      <text x="0" y="23">swallows keystrokes before</text>
      <text x="0" y="46">DOM or undo history.</text>
    </g>

    <!-- Bottom Spec Pill -->
    <rect x="0" y="196" width="232" height="44" rx="6" fill="#F8F7F3" stroke="#CFCBC2" stroke-width="1" />
    <text x="14" y="223" fill="#141413" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600"><tspan fill="#107A4D">;;password</tspan> / <tspan fill="#B42318">;;!PIN</tspan></text>
  </g>

  <!-- ================= COLUMN 3: STEP 03 (x=600..888) ================= -->
  <g transform="translate(628, 56)">
    <!-- Step Top Row -->
    <text x="0" y="22" fill="#107A4D" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.04em">STEP 03</text>
    <g transform="translate(198, 0)">
      <rect width="34" height="34" rx="6" fill="#107A4D" fill-opacity="0.1" stroke="#107A4D" stroke-opacity="0.25" stroke-width="1" />
      <g transform="translate(8, 8)" stroke="#107A4D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M9 1L2 4v5c0 4.5 3 8 7 9 4-1 7-4.5 7-9V4L9 1z" />
        <path d="M6.5 9.5l2 2 3.5-3.5" />
      </g>
    </g>

    <!-- Title -->
    <text x="0" y="76" fill="#141413" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" letter-spacing="-0.03em">RAM Vault &amp; Images</text>

    <!-- Description -->
    <g transform="translate(0, 110)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#565860">
      <text x="0" y="0"><tspan fill="#141413" font-weight="600">Argon2id</tspan> + <tspan fill="#141413" font-weight="600">AES-256-GCM</tspan></text>
      <text x="0" y="23">decrypts real title, body &amp;</text>
      <text x="0" y="46"><tspan fill="#107A4D" font-weight="600">blob:</tspan> images in memory.</text>
    </g>

    <!-- Bottom Spec Pill -->
    <rect x="0" y="196" width="232" height="44" rx="6" fill="#F8F7F3" stroke="#CFCBC2" stroke-width="1" />
    <text x="14" y="223" fill="#107A4D" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">64 MiB KDF + 4 KB pad</text>
  </g>

  <!-- ================= COLUMN 4: STEP 04 (x=888..1176) ================= -->
  <g transform="translate(916, 56)">
    <!-- Step Top Row -->
    <text x="0" y="22" fill="#107A4D" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.04em">STEP 04</text>
    <g transform="translate(198, 0)">
      <rect width="34" height="34" rx="6" fill="#107A4D" fill-opacity="0.1" stroke="#107A4D" stroke-opacity="0.25" stroke-width="1" />
      <g transform="translate(8, 8)" stroke="#107A4D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <rect x="2" y="8" width="14" height="9" rx="2" />
        <path d="M5 8V5a4 4 0 0 1 8 0v3" />
      </g>
    </g>

    <!-- Title -->
    <text x="0" y="76" fill="#141413" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" letter-spacing="-0.03em">Instant Auto-Mask</text>

    <!-- Description -->
    <g transform="translate(0, 110)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#565860">
      <text x="0" y="0">Tab switch, blur, idle, or</text>
      <text x="0" y="23"><tspan fill="#141413" font-weight="600">Ctrl+Shift+X</tspan> zeroes keys</text>
      <text x="0" y="46">and restores the cover.</text>
    </g>

    <!-- Bottom Spec Pill -->
    <rect x="0" y="196" width="232" height="44" rx="6" fill="#F8F7F3" stroke="#CFCBC2" stroke-width="1" />
    <text x="14" y="223" fill="#141413" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">Zero disk plaintext</text>
  </g>

  <!-- ================= BOTTOM HORIZONTAL BAND (y=332..396, height: 64px) ================= -->
  <!-- Left Half: ON DISK & CLOUD SYNC -> Weekend Errands.md (Cover body + encrypted draft_cache YAML) -->
  <g transform="translate(48, 368)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <circle cx="0" cy="-4" r="3.5" fill="#565860" />
    <text x="12" y="0" fill="#141413" font-weight="600">
      ON DISK &amp; CLOUD SYNC -&gt; <tspan fill="#107A4D">Weekend Errands.md</tspan> <tspan fill="#565860" font-weight="500">(Cover body + encrypted draft_cache YAML)</tspan>
    </text>
  </g>

  <!-- Right Half: IN RAM WHILE UNLOCKED -> Q4 Acquisition Targets.md (Real title + real text + inline images) -->
  <g transform="translate(624, 368)" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <circle cx="0" cy="-4" r="3.5" fill="#20E6A1" />
    <text x="12" y="0" fill="#ECEAE4" font-weight="600">
      IN RAM WHILE UNLOCKED -&gt; <tspan fill="#20E6A1">Q4 Acquisition Targets.md</tspan> <tspan fill="#8E8D86" font-weight="500">(Real title, text &amp; RAM images)</tspan>
    </text>
  </g>
</svg>
