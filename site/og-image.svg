      <circle cx="19" cy="46" r="3.5" fill="#F1EFEB" />
      <path d="M39 64C39 51 46 45 57 45H64V64H39Z" fill="#141413" />
      <circle cx="34" cy="34" r="5.8" fill="#141413" />
      <circle cx="32" cy="32" r="2" fill="#F1EFEB" />
      <circle cx="51" cy="34" r="5.8" fill="#141413" />
      <circle cx="49" cy="32" r="2" fill="#F1EFEB" />
    </svg>
    <text x="58" y="30" fill="#141413" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="-0.04em">VENEER</text>
  </g>

  <!-- Top Bar Right: veener.fariz.tech (16px monospace, #107A4D) -->
  <text x="1132" y="80" text-anchor="end" fill="#107A4D" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" letter-spacing="0.02em">veener.fariz.tech</text>

  <!-- Main Body Upper/Left Area: Huge Crisp Headline + Monospace Subtitle -->
  <g transform="translate(68, 198)">
    <text x="0" y="0" fill="#141413" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="700" letter-spacing="-0.04em">Notes that look like</text>
    <text x="0" y="76" fill="#107A4D" font-family="'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="700" letter-spacing="-0.04em"><tspan fill="#107A4D">ordinary notes.</tspan></text>

    <text x="0" y="134" fill="#565860" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="500" letter-spacing="-0.01em">
      Hide real notes, titles &amp; images in Obsidian. Type <tspan fill="#107A4D" font-weight="700">;;</tspan> to reveal.
    </text>
  </g>

