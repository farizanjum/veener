  <!-- Lower-Left Conversion CTA Button & Tag -->
  <text x="68" y="434" fill="#6B6D76" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0.06em">AES-256-GCM + ARGON2ID</text>
