<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Subtle 20px Swiss Dotted Grid -->
    <pattern id="swiss-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D5D3CA" />
    </pattern>

    <!-- Mint #20E6A1 + Registration Cross -->
    <g id="reg-cross">
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#20E6A1" stroke-width="1.5" />
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#20E6A1" stroke-width="1.5" />
    </g>
  </defs>

  <!-- Warm Stone Canvas (#EFEFEA) + 20px Dot Grid -->
  <rect width="1200" height="630" fill="#EFEFEA" />
  <rect width="1200" height="630" fill="url(#swiss-dots)" />

  <!-- Outer Swiss Frame (x=36, y=36, width=1128, height=558) -->
  <rect x="36" y="36" width="1128" height="558" fill="#F1EFEB" fill-opacity="0.72" stroke="#CFCBC2" stroke-width="1" />

  <!-- Top Bar (height: 76px -> y=36..112, border-bottom: 1px solid #CFCBC2) -->
  <rect x="36.5" y="36.5" width="1127" height="75.5" fill="#F8F7F3" />
  <line x1="36" y1="112" x2="1164" y2="112" stroke="#CFCBC2" stroke-width="1" />

  <!-- Subtle Horizontal Swiss Divider before 3D Isometric Footer Playground -->
  <line x1="36" y1="384" x2="1164" y2="384" stroke="#CFCBC2" stroke-width="1" />

  <!-- Mint #20E6A1 + Registration Crosses at Frame Corners & Grid Intersections -->
  <use href="#reg-cross" x="36" y="36" />
  <use href="#reg-cross" x="1164" y="36" />
  <use href="#reg-cross" x="36" y="594" />
  <use href="#reg-cross" x="1164" y="594" />
  <use href="#reg-cross" x="36" y="112" />
  <use href="#reg-cross" x="1164" y="112" />
  <use href="#reg-cross" x="36" y="384" />
  <use href="#reg-cross" x="1164" y="384" />

  <!-- Top Bar Left: Chameleon Icon Mark (42x42) + VENEER (24px bold #141413) -->
  <g transform="translate(68, 53)">
    <svg width="42" height="42" viewBox="0 0 64 64" fill="none">
      <rect width="64" height="64" rx="14" fill="#107A4D" />
      <path d="M64 64H16C7 64 2 57 2 48C2 39 9 33 17 33C24 33 29 38 29 45C29 50 25 53 20 53C16 53 13 50 13 46C13 43 16 41 19 41L25 55C23 50 22 45 22 39C22 28 29 20 38 18C40 11 45 7 52 7C58 7 63 12 64 19V64Z" fill="#F1EFEB" />
