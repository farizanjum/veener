name: Plugin CI Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality-gate:
    name: Build, Test & Obsidian Scanner Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deterministic dependencies
        run: npm ci

      - name: Run strict TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit and integration suite
        run: npm test

      - name: Build production Obsidian plugin bundle
        run: npm run build

      - name: Run Obsidian Scanner preflight & bundle verification
        run: npm run preflight:dist

      - name: Verify deterministic release packaging
        run: npm run package:release

      - name: Run marketing site static & mobile smoke checks
        run: npm run smoke:site
